# External uptime check for jdsys.biz
# Runs outside Manus hosting — still alerts when the whole site is down.
name: Uptime jdsys.biz

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime-jdsys
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check https://jdsys.biz/api/health
        run: |
          set -euo pipefail
          URL="https://jdsys.biz/api/health"
          HOME_URL="https://jdsys.biz/"
          FAIL=0

          echo "Ping $URL"
          CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            -A "JDStudio-UptimeMonitor/1.0" \
            --connect-timeout 15 --max-time 30 \
            "$URL" || echo "000")
          echo "health HTTP $CODE"
          cat /tmp/health.json 2>/dev/null || true
          echo

          if [[ "$CODE" != "200" ]]; then
            echo "::error::jdsys.biz /api/health returned $CODE"
            FAIL=1
          else
            if ! grep -q '"ok":true\|"ok": true' /tmp/health.json; then
              echo "::error::health body missing ok:true"
              FAIL=1
            fi
          fi

          echo "Ping $HOME_URL"
          HCODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -A "JDStudio-UptimeMonitor/1.0" \
            --connect-timeout 15 --max-time 30 \
            "$HOME_URL" || echo "000")
          echo "home HTTP $HCODE"
          if [[ "$HCODE" != "200" ]]; then
            echo "::error::jdsys.biz home returned $HCODE"
            FAIL=1
          fi

          # Soft signal: Cloudflare 502 pages often mention railway / bad gateway
          if [[ "$HCODE" == "502" || "$CODE" == "502" ]]; then
            echo "::error::502 Bad Gateway — check Manus hosting / DNS (not Railway direct origin)"
          fi

          exit "$FAIL"

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 jdsys.biz down / unhealthy (${new Date().toISOString()})`;
            const body = [
              'Automated uptime check failed.',
              '',
              '- URL: https://jdsys.biz/api/health',
              '- Home: https://jdsys.biz/',
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Likely causes: Manus hosting 502, DNS/origin pointing at dead Railway, or Cloudflare origin error.',
              'Fix: confirm custom domain is Manus-managed only; republish on Manus; do not point jdsys.biz at Railway directly.',
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 30,
            });
            const existing = issues.data.find((i) => i.title.startsWith('🚨 jdsys.biz'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing at ${new Date().toISOString()}\n\n${body}`,
              });
              core.info(`Commented on existing issue #${existing.number}`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
